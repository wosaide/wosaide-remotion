<svg xmlns="http://www.w3.org/2000/svg" viewBox="84 16 832 474" role="img" aria-labelledby="title desc">
  <title id="title">WOS Aide animated brand mark</title>
  <desc id="desc">Transparent animated SVG with the final bird, two laurels and five gold stars.</desc>
  <style>
    :root { --ink: #242424; --gold: #ffb728; }
    .branch-enter { --branch-delay: 0s; opacity: 1; }
    .branch-enter.right { --branch-delay: .04s; }
    .branch-left { transform-box: fill-box; transform-origin: 82% 100%; animation: branchLeft 4.6s ease-in-out 1.05s infinite; }
    .branch-right { transform-box: fill-box; transform-origin: 18% 100%; animation: branchRight 4.6s ease-in-out 1.12s infinite; }
    .laurel-leaf { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: leafGrow .46s cubic-bezier(.2,1.18,.35,1) forwards; }
    .leaf-0 { animation-delay: calc(var(--branch-delay) + .04s); }
    .leaf-1 { animation-delay: calc(var(--branch-delay) + .10s); }
    .leaf-2 { animation-delay: calc(var(--branch-delay) + .16s); }
    .leaf-3 { animation-delay: calc(var(--branch-delay) + .22s); }
    .leaf-4 { animation-delay: calc(var(--branch-delay) + .28s); }
    .leaf-5 { animation-delay: calc(var(--branch-delay) + .34s); }
    .leaf-6 { animation-delay: calc(var(--branch-delay) + .40s); }
    .leaf-7 { animation-delay: calc(var(--branch-delay) + .46s); }
    .leaf-8 { animation-delay: calc(var(--branch-delay) + .52s); }
    .leaf-9 { animation-delay: calc(var(--branch-delay) + .58s); }
    .leaf-10 { animation-delay: calc(var(--branch-delay) + .64s); }
    .leaf-11 { animation-delay: calc(var(--branch-delay) + .70s); }
    .leaf-12 { animation-delay: calc(var(--branch-delay) + .76s); }
    .bird-enter { transform-box: fill-box; transform-origin: 50% 72%; animation: birdEnter .72s cubic-bezier(.18,.9,.2,1) both, birdFloat 4.8s ease-in-out 1.05s infinite; }
    .bird-fill { fill: var(--ink); }
    .star { --intro-rotation: 0deg; --intro-x: 0px; opacity: 0; transform-box: fill-box; transform-origin: center; animation: starPop .5s cubic-bezier(.2,1.5,.35,1) forwards, starPulse 3.2s ease-in-out 1.6s infinite; }
    .star.left { --intro-rotation: -10deg; }
    .star.right { --intro-rotation: 10deg; }
    .s1 { --intro-x: 24px; animation-delay: 1.18s, 1.95s; }
    .s2 { --intro-x: 13px; animation-delay: .98s, 1.75s; }
    .s3 { --intro-x: 0px; animation-delay: .78s, 1.55s; }
    .s4 { --intro-x: -13px; animation-delay: .98s, 1.75s; }
    .s5 { --intro-x: -24px; animation-delay: 1.18s, 1.95s; }
    @keyframes leafGrow { 0% { opacity: 0; transform: translateY(22px) scale(.05); } 68% { opacity: 1; transform: translateY(-1.5px) scale(1.06); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes branchLeft { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-1.35deg); } }
    @keyframes branchRight { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.35deg); } }
    @keyframes birdEnter { 0% { transform: translateY(7px) scale(.972) rotate(-.55deg); } 68% { transform: translateY(-1.5px) scale(1.006) rotate(.12deg); } 100% { transform: translateY(0) scale(1) rotate(0); } }
    @keyframes birdFloat { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1.8px) rotate(-.16deg); } }
    @keyframes starPop { 0% { opacity: 0; transform: translate(var(--intro-x), 7px) scale(.22) rotate(var(--intro-rotation)); } 70% { opacity: 1; transform: translate(0, -1px) scale(1.12) rotate(0deg); } 100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); } }
    @keyframes starPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .bird-enter { transform: none !important; } }
  </style>

